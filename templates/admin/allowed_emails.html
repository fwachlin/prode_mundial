{% extends "base.html" %}

{% block title %}Admin - Emails habilitados{% endblock %}

{% block content %}
<div style="max-width: 700px; margin: 0 auto;">
    <a href="{{ url_for('admin.manage_users') }}" class="btn btn-primary" style="background-color:#007bff; border-color:#007bff; color:white; margin-bottom:18px; font-weight:bold; font-size:1.1em; padding:8px 22px;">← Volver</a>
    <h1>Agregar al jugador:</h1>

    <form method="POST" style="margin: 20px 0;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div style="display:flex; gap:10px; margin-bottom: 10px;">
            <input type="text" name="name" placeholder="Nombre del participante" required
                   style="flex:1; padding:10px; border:1px solid #ddd; border-radius:8px;">
            <input type="email" name="email" placeholder="usuario@dominio.com" required
                   style="flex:1; padding:10px; border:1px solid #ddd; border-radius:8px;">
            <button type="submit" class="btn btn-primary">Agregar</button>
        </div>
        
    </form>

    {% if emails %}
        <table style="width:100%; border-collapse: collapse;">
            <thead>
                <tr style="background:#f5f5f5;">
                    <th style="text-align:left; padding:8px; border:1px solid #ddd;">Nombre</th>
                    <th style="text-align:left; padding:8px; border:1px solid #ddd;">Email</th>
                    <th style="text-align:center; padding:8px; border:1px solid #ddd;">Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for e in emails %}
                <tr>
                    <td style="padding:8px; border:1px solid #ddd;">{{ e.name }}</td>
                    <td style="padding:8px; border:1px solid #ddd;">{{ e.email }}</td>
                    <td style="text-align:center; padding:8px; border:1px solid #ddd;">
                        <form method="POST" action="{{ url_for('admin.delete_allowed_email', email_id=e.id) }}"
                              onsubmit="return confirm('¿Eliminar {{ e.email }}?');">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                            <button type="submit" class="btn btn-danger">Eliminar</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        
    {% endif %}
</div>
{% endblock %}
