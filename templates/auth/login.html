<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Prode Mundial</title>
</head>
<body>
    {% extends "base.html" %}

    {% block title %}Iniciar Sesión - Prode Mundial{% endblock %}

    {% block content %}
    <div style="max-width: 400px; margin: 50px auto;">
        <h2>Iniciar Sesión</h2>
        
        <form method="POST">
            <div style="margin-bottom: 15px;">
                <label>Email:</label>
                <input type="email" name="email" required style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #d1d5db;">
            </div>
            
            <div style="margin-bottom: 15px;">
                <label>Contraseña:</label>
                <input type="password" name="password" required style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #d1d5db;">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">Iniciar Sesión</button>
        </form>
        
        <p style="margin-top: 20px; text-align: center;">
            ¿No tienes cuenta? <a href="{{ url_for('auth.register') }}" style="color: var(--primary);">Registrarse</a>
        </p>
    </div>
    {% endblock %}
</body>
</html>
