{% extends "base.html" %}

{% block title %}Registrarse - Prode Mundial{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-lg border-0 mt-5">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill text-success" style="font-size: 3rem;"></i>
                    <h2 class="mt-3 fw-bold">Crear Cuenta</h2>
                    
                </div>
                
                <form method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            <i class="bi bi-envelope-fill me-2"></i>Email
                        </label>
                        <input type="email" class="form-control" id="email" name="email" required autofocus placeholder="tu@email.com">
                        <div class="form-text">
                            <i class="bi bi-info-circle me-1"></i>
                            Asegúrate de usar un email autorizado.
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="bi bi-lock-fill me-2"></i>Contraseña
                        </label>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="Mínimo 4 caracteres">
                    </div>
                    
                    <div class="mb-4">
                        <label for="password_confirm" class="form-label">
                            <i class="bi bi-lock-fill me-2"></i>Confirmar Contraseña
                        </label>
                        <input type="password" class="form-control" id="password_confirm" name="password_confirm" required placeholder="Repite tu contraseña">
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100 py-2">
                        <i class="bi bi-check-circle-fill me-2"></i>Crear Cuenta
                    </button>
                </form>
                
                <hr class="my-4">
                
                <p class="text-center mb-0">
                    ¿Ya tienes cuenta? 
                    <a href="{{ url_for('auth.login') }}" class="fw-bold text-decoration-none">
                        Iniciar Sesión <i class="bi bi-arrow-right"></i>
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
