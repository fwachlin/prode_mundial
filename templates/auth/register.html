{% extends "base.html" %}

{% block title %}Registrarse - Prode Mundial{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto;">
    <h2>Registrarse</h2>
    
    <form method="POST">
        <div style="margin-bottom: 15px;">
            <label>Nombre:</label>
            <input type="text" name="name" required style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #d1d5db;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label>Email:</label>
            <input type="email" name="email" required style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #d1d5db;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label>Contraseña:</label>
            <input type="password" name="password" required style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #d1d5db;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label>Confirmar Contraseña:</label>
            <input type="password" name="password_confirm" required style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #d1d5db;">
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">Registrarse</button>
    </form>
    
    <p style="margin-top: 20px; text-align: center;">
        ¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}" style="color: var(--primary);">Iniciar Sesión</a>
    </p>
</div>
{% endblock %}
