<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Prode Mundial{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding-top: 60px; background: #f5f5f5; }
        nav { position: fixed; top: 0; left: 0; right: 0; background: #333; color: #fff; padding: 12px 0; z-index: 1000; }
        .navbar { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: white; text-decoration: none; margin-right: 12px; }
        .navbar a.admin-btn { color: #f39c12; font-weight: bold; }
        .container { max-width: 1200px; margin: 20px auto; padding: 20px; background: #fff; border-radius: 8px; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav>
        <div class="navbar">
            <a href="{{ url_for('main.index') }}">⚽ Prode Mundial 2026</a>
            <div>
                <a href="{{ url_for('main.rankings') }}">Rankings</a>
                <a href="{{ url_for('main.all_predictions') }}">Todos los Pronósticos</a>
                <a href="{{ url_for('main.reglamento') }}">📜 Reglamento</a>
                
                {% if current_user.is_authenticated %}
                    {% if current_user.is_admin %}
                        <a href="{{ url_for('admin.dashboard') }}" class="admin-btn">⚙️ Admin</a>
                    {% endif %}
                    <a href="{{ url_for('auth.logout') }}">Cerrar Sesión</a>
                {% else %}
                    <a href="{{ url_for('auth.login') }}">Iniciar Sesión</a>
                    <a href="{{ url_for('auth.register') }}">Registrarse</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
